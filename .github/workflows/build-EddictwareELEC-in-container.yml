name: Build image in container (without prebuilt toolchain)

on:
  # push:
  #   branches:
  #     - master
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to run against'
        required: true
        type: choice
        options:
          - self-hosted
          - github
          - blacksmith
          - aws
          - arc-runner-set
        default: self-hosted
      os:
        description: 'OS codename of build container'
        required: true
        type: choice
        options:
          - bookworm
          - jammy
          - jammy-extended
          - noble
          - noble-custom
          - plucky
          - questing
          - sid
        default: jammy-extended
      arch:
        description: 'Arch of build target'
        required: true
        type: choice
        options:
          - amd64
          - aarch64
          - arm
          - x86_64
        default: aarch64
      cache:
        description: 'Enable cache build'
        required: true
        type: boolean
        default: true
      debug:
        description: 'Enable debug build'
        required: true
        type: boolean
        default: false

run-name: ${{ format('{0} ({1}/{2}/{3}/{4}{5})', github.workflow, inputs.runner, inputs.os, inputs.arch, inputs.cache && 'cache' || 'no-cache', inputs.debug && '/debug' || '') }}

env:
  CACHE: ${{ inputs.cache }}
  DEBUG: ${{ inputs.debug }}
  OS_Codename: ${{ inputs.os || 'noble' }}
  EE_Distro: EddictwareELEC
  EE_Project: RPi
  EE_Device: RPi4
  EE_Arch: ${{ inputs.arch || 'aarch64' }}
  EE_DistroTag: ""
  EE_image_pathfilename: ""
  EE_image_filename: ""
  # EE_Registry: ${{ secrets.REGISTRY_PRIVATE_FQDN }} # ${{ secrets.REGISTRY_FQDN }}
  EE_Registry: ghcr.io
  IMG_ROOT_BUILD_DIR: "/build"
  CHMOD_SYNTAX: u=rwx,g=rwxs,o=rx # add the Group Sticky Bit (g+s) to enforce group write permissions
  STAT_SYNTAX: "%U(%u):%G(%g) %a %A %n"

defaults:
  run:
    shell: bash

jobs:
  resolve-runner:
    uses: ./.github/workflows/resolve-runner.yml
    with:
      runner: ${{ inputs.runner }}
      debug: ${{ inputs.debug }}
      blacksmith-label: blacksmith-32vcpu-ubuntu-2404

  init:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'Eddict' }}
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    # if: github.event.head_commit.author.username != 'Eddict' || github.event_name == 'workflow_dispatch'
    #   && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    env:
      BUILDKIT_PROGRESS: 'auto' # 'plain' 'quiet'
      USE_KNOWN_UID_GID: 'true'
    # Expose step outputs as job outputs
    outputs:
      ee_distrotag: ${{ steps.compose-image-tag.outputs.EE_DistroTag }}
      host_uid: ${{ steps.determine-ids.outputs.HOST_UID }}
      host_gid: ${{ steps.determine-ids.outputs.HOST_GID }}
      # docker_uid: ${{ steps.determine-ids.outputs.DOCKER_UID }}
      # docker_gid: ${{ steps.determine-ids.outputs.DOCKER_GID }}
      img_uid: ${{ steps.determine-ids.outputs.IMG_UID }}
      img_gid: ${{ steps.determine-ids.outputs.IMG_GID }}
      build_dir: ${{ steps.determine-build-dir.outputs.BUILD_DIR }}

    steps:
      - name: Get Date
        id: get-date
        run: |
          # echo "[date]: $(/bin/date -u "+%Y%m%d")"
          echo "date=$(/bin/date -u "+%Y%m%d")" | tee -a $GITHUB_OUTPUT

      - name: Compose image tag
        id: compose-image-tag
        run: |
          dTag="${{ env.EE_Registry }}/${{ github.repository_owner }}/${{ env.EE_Distro }}:${{ env.OS_Codename }}"
          # Use ,, to convert all characters to lowercase
          echo "EE_DistroTag=${dTag,,}"
          echo "EE_DistroTag=${dTag,,}" | tee -a $GITHUB_ENV # for later steps in this job
          echo "EE_DistroTag=${dTag,,}" | tee -a $GITHUB_OUTPUT # for the job output / other jobs

      - name: Log in to registry
        id: log-in-to-registry
        if: ${{ env.USE_KNOWN_UID_GID != 'true' }}
        uses: docker/login-action@v4
        with:
          # registry: ${{ secrets.REGISTRY_PRIVATE_FQDN }} #https:// #:5000
          # username: ${{ secrets.REGISTRY_USER }}
          # password: ${{ secrets.REGISTRY_PWD }}
          registry: ${{ env.EE_Registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine UIDs and GIDs
        id: determine-ids
        run: |
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)

          if [[ "${{ env.USE_KNOWN_UID_GID }}" == "true" ]]; then
            # hardcode IMG_UID and IMG_GID to speed up the workflow by avoiding fetching from the image
            IMG_UID=1000
            IMG_GID=1000
          else
            if IDS=$(docker run --rm --pull=always --entrypoint sh ${{ env.EE_DistroTag }} -c 'echo "$(id -u) $(id -g)"'); then
              read -r IMG_UID IMG_GID <<< "$IDS"
            else
              echo "::warning::Failed to fetch image UID/GID from ${{ env.EE_DistroTag }}. Falling back to host 'docker' user/group."

              if ! IMG_UID=$(id -u docker); then
                echo "::warning::Failed to fetch UID for user docker on the host. Falling back to Host UID ($HOST_UID)."
                IMG_UID=$HOST_UID
              fi

              if ! IMG_GID=$(id -g docker); then
                echo "::warning::Failed to fetch GID for group docker on the host. Falling back to Host GID ($HOST_GID)."
                IMG_GID=$HOST_GID
              fi
            fi
          fi

          # Output clean, reliable variables to the next steps
          echo "HOST_UID=$HOST_UID" | tee -a $GITHUB_OUTPUT
          echo "HOST_GID=$HOST_GID" | tee -a $GITHUB_OUTPUT
          echo "IMG_UID=$IMG_UID" | tee -a $GITHUB_OUTPUT
          echo "IMG_GID=$IMG_GID" | tee -a $GITHUB_OUTPUT

      - name: Determine BUILD_DIR
        id: determine-build-dir
        run: |
          BUILD_DIR="build.${{ env.EE_Distro }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel"
          echo "BUILD_DIR=$BUILD_DIR" | tee -a $GITHUB_OUTPUT

  build:
    needs:
      - resolve-runner
      - init
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    env:
      HOST_UID: ${{ needs.init.outputs.host_uid }}
      HOST_GID: ${{ needs.init.outputs.host_gid }}
      IMG_UID: ${{ needs.init.outputs.img_uid }}
      IMG_GID: ${{ needs.init.outputs.img_gid }}
      CHMOD_SYNTAX: u=rwx,g=rwxs,o=rx # add the Group Sticky Bit (g+s) to enforce group write permissions
      BUILD_DIR: ${{ needs.init.outputs.build_dir }}
      EE_DistroTag: ${{ needs.init.outputs.ee_distrotag }}
      LOCAL_BUILD_CACHE: "${{ github.workspace }}/../build-cache"
    steps:
      - name: Checkout repository
        if: ${{ inputs.runner != 'blacksmith' }}
        uses: actions/checkout@v7
      - name: Checkout repository for blacksmith
        if: ${{ inputs.runner == 'blacksmith' }}
        uses: useblacksmith/checkout@v1

      - &check-repo-folder # Define a reusable anchor for this step
        name: Check repo folder after checkout
        if: ${{ env.DEBUG == 'true' }}
        # id: check-repo-folder # cannot reuse the same ID for multiple steps when using the anchor
        run: |
          echo "/etc/passwd"
          cat /etc/passwd
          echo "/etc/group"
          cat /etc/group
          echo "PWD: $PWD"
          echo "Listing contents of PWD:"
          ls -la $PWD
          echo "Listing contents of repository folder:"
          ls -la ${{ github.workspace }}
          echo "Checking repository folder: ${{ github.workspace }}"
          # Check if the repository folder exists and is not empty
          if [ ! -d "${{ github.workspace }}" ] || [ "$(ls -A ${{ github.workspace }} 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "Repository folder is missing or empty: ${{ github.workspace }}"
            exit 1
          fi

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.EE_Registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing build cache (persistent runners)
        id: check-build-cache
        if: ${{ inputs.cache && needs.resolve-runner.outputs.runner == 'self-hosted' }}
        env:
          BUILD_DIR_PATHS: >-
            "${{ env.BUILD_DIR }}/.ccache"
            "${{ env.BUILD_DIR }}/.stamps"
            "${{ env.BUILD_DIR }}/.cache_package_global"
            "${{ env.BUILD_DIR }}/.cache_package_local"
            sources 
            toolchain
        run: |
          # Check if all required cache dirs/files exist and are non-empty
          missing=0
          for d in "${BUILD_DIR_PATHS[@]}"; do
            if [ ! -e "$d" ] || [ "$(ls -A $d 2>/dev/null | wc -l)" -eq 0 ]; then
              echo "Cache missing or empty: $d"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "build_cache_present=true" >> $GITHUB_OUTPUT
          else
            echo "build_cache_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore build caches
        id: restore-build-caches
        if: ${{ inputs.cache && ((needs.resolve-runner.outputs.runner != 'self-hosted' && inputs.runner == 'blacksmith') || steps.check-build-cache.outputs.build_cache_present != 'true') }}
        uses: actions/cache/restore@v6
        with:
          key: "${{ runner.os }}-${{ github.actor }}-${{ env.OS_Codename }}-${{ env.EE_Arch }}-build-cache"
          path: ${{ env.LOCAL_BUILD_CACHE }}
      - name: Restore build caches for blacksmith
        id: restore-build-caches-blacksmith
        if: ${{ inputs.cache && inputs.runner == 'blacksmith' }}
        uses: useblacksmith/stickydisk@v1
        with:
          key: "${{ runner.os }}-${{ github.actor }}-${{ env.OS_Codename }}-${{ env.EE_Arch }}-build-cache"
          path: ${{ env.LOCAL_BUILD_CACHE }}

      - name: Prepare (cache) dirs for container
        id: prepare-cache-dirs
        # if: ${{ inputs.cache && !inputs.cache }}
        env:
          BUILD_DIR_PATHS: >-
            "${{ env.BUILD_DIR }}"
            "${{ env.BUILD_DIR }}/.ccache"
            "${{ env.BUILD_DIR }}/.stamps"
            sources 
            target
            toolchain
          BUILD_CACHE_PATHS: >-
            "${{ env.LOCAL_BUILD_CACHE }}"
            "${{ env.LOCAL_BUILD_CACHE }}/.ccache"
            "${{ env.LOCAL_BUILD_CACHE }}/.stamps"
            "${{ env.LOCAL_BUILD_CACHE }}/sources"
            "${{ env.LOCAL_BUILD_CACHE }}/toolchain"
        run: |
          sudo mkdir --parents ${{ env.BUILD_DIR_PATHS }}
          sudo chown -R ${{ env.HOST_UID }}:${{ env.HOST_GID }} ${{ env.BUILD_DIR_PATHS }}
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} ${{ env.BUILD_DIR_PATHS }}

          sudo mkdir --parents ${{ env.BUILD_CACHE_PATHS }}
          sudo chown -R ${{ env.HOST_UID }}:${{ env.HOST_GID }} ${{ env.BUILD_CACHE_PATHS }}
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} ${{ env.BUILD_CACHE_PATHS }}

      - name: Prepare container parameters
        id: prepare-container-params
        run: |
          # on self-hosted runners request a larger container memory; allow override via CONTAINER_MEMORY
          if [ "${{ needs.resolve-runner.outputs.runner }}" == "self-hosted" ]; then
            CONTAINER_MEMORY="${CONTAINER_MEMORY:-12g}"
            MEMORY_ARG="--memory=${CONTAINER_MEMORY}"
          else
            MEMORY_ARG=""
          fi

          OUTFILE="${{ github.workspace }}/container_params.sh"
          touch "$OUTFILE" 2>&1
          # Write a small shell fragment into the workspace that can be sourced on the host
          # to provide docker run flags (MEMORY_ARG) and other host-side params if needed.
          # Write concrete value (expand MEMORY_ARG here) so the host can source it
          echo "#!/bin/bash" > "$OUTFILE"
          echo "# Generated by prepare-container-params" >> "$OUTFILE"
          echo "MEMORY_ARG='${MEMORY_ARG}'" >> "$OUTFILE"

          sudo chmod +x "$OUTFILE"
          cat "$OUTFILE"

      - name: Create build_recommend script
        id: create-build-recommend
        run: |
          # create a small script in the workspace to compute a safe -j inside the container
          cat > "${{ github.workspace }}/build_recommend.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          NB_CORES=$(grep -c '^processor' /proc/cpuinfo || nproc)
          PER_JOB_MB=${PER_JOB_MB:-2000}
          RESERVE_MB=${RESERVE_MB:-2048}
          mem_bytes=0
          if [ -f /sys/fs/cgroup/memory.max ]; then
            memmax=$(cat /sys/fs/cgroup/memory.max)
            if [ "$memmax" != "max" ]; then
              mem_bytes=$memmax
            fi
          fi
          if [ "$mem_bytes" -eq 0 ] 2>/dev/null; then
            if [ -f /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
              memlim=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
              if [ "$memlim" -lt 9223372036854771712 ] 2>/dev/null; then
                mem_bytes=$memlim
              fi
            fi
          fi
          if [ "$mem_bytes" -eq 0 ] 2>/dev/null; then
            mem_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
            mem_bytes=$((mem_kb*1024))
          fi
          TOTAL_MB=$((mem_bytes/1024/1024))
          USABLE_MB=$((TOTAL_MB-RESERVE_MB))
          if [ "$USABLE_MB" -lt 256 ]; then USABLE_MB=256; fi
          MAX_J_BY_RAM=$((USABLE_MB/PER_JOB_MB))
          if [ "$MAX_J_BY_RAM" -lt 1 ]; then MAX_J_BY_RAM=1; fi
          CANDIDATE_J=$((NB_CORES+2))
          if [ "$CANDIDATE_J" -gt "$MAX_J_BY_RAM" ]; then RECOMMENDED_J=$MAX_J_BY_RAM; else RECOMMENDED_J=$CANDIDATE_J; fi
          if [ "$RECOMMENDED_J" -gt $((NB_CORES*2)) ]; then RECOMMENDED_J=$((NB_CORES*2)); fi
          EOF

          sudo chmod +x "${{ github.workspace }}/build_recommend.sh"
          cat "${{ github.workspace }}/build_recommend.sh"

      # Repeat the check-repo-folder step to ensure the repository folder is still valid before building the image
      - *check-repo-folder

      - name: Host diagnostics
        id: host-diagnostics
        if: ${{ inputs.debug }}
        continue-on-error: true
        run: |
          set -euo pipefail
          DIAG_DIR="${{ github.workspace }}/ci-diagnostics"
          DIAG_LOG="${DIAG_DIR}/host.log"
          mkdir --parents "${DIAG_DIR}"
          {
            echo "HOST DIAGNOSTIC: $(date -u)"
            uname -a
            echo "--- docker --version ---"
            docker --version || echo "docker: not found"
            echo "--- workspace top files ---"
            ls -al "${PWD}" | sed -n '1,200p'
          } > "${DIAG_LOG}" 2>&1

      - name: In-container diagnostics
        id: in-container-diagnostics
        # if: ${{ inputs.debug }}
        # continue-on-error: true
        env:
          IMG_ROOT_BUILD_DIR: ${{ env.IMG_ROOT_BUILD_DIR }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.EE_DistroTag }}"
          echo "Running in-container diagnostics inside image: ${IMAGE}"

          # Pull image best-effort
          docker image pull "${IMAGE}"

          DIAG_DIR="${{ env.IMG_ROOT_BUILD_DIR }}/ci-diagnostics"
          sudo mkdir --parents "${DIAG_DIR}"

          # Run container with matched image user and supplementary host group
          . "${{ github.workspace }}/container_params.sh"
          docker run \
            --rm \
            --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} \
            --group-add ${{ env.HOST_GID }} \
            ${MEMORY_ARG} \
            -w "${{ env.IMG_ROOT_BUILD_DIR }}" \
            -v "${{ github.workspace }}:${{ env.IMG_ROOT_BUILD_DIR }}" \
            -e DIAG_DIR="${DIAG_DIR}" \
            "$IMAGE" \
            bash -c 'umask 0002 && exec bash -lc '\''
              set -euo pipefail
              DIAG_LOG="${DIAG_DIR}/in-container.log"
              {
                echo "CONTAINER DIAGNOSTIC: $(date -u)"
                echo "--- id ---"
                id
                echo "--- CPU ---"
                echo "nproc: $(nproc 2>/dev/null || echo unavailable)"
                echo "Visible processors: $(grep -c "^processor" /proc/cpuinfo || true)"
                echo "--- cgroup membership ---"
                cat /proc/self/cgroup || true

                for path in \
                  /sys/fs/cgroup/cpu.max \
                  /sys/fs/cgroup/cpuset.cpus.effective \
                  /sys/fs/cgroup/memory.max \
                  /sys/fs/cgroup/memory.current \
                  /sys/fs/cgroup/cpu/cpu.cfs_quota_us \
                  /sys/fs/cgroup/cpu/cpu.cfs_period_us \
                  /sys/fs/cgroup/cpuset/cpuset.cpus \
                  /sys/fs/cgroup/memory/memory.limit_in_bytes \
                  /sys/fs/cgroup/memory/memory.usage_in_bytes
                do
                  if [[ -r "$path" ]]; then
                    printf "%s: " "$path"
                    cat "$path"
                  fi
                done
              } > "${DIAG_LOG}" 2>&1
            '\'''
          exit 1

      - name: Upload CI diagnostics
        if: ${{ always() && !cancelled() && inputs.debug }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: |
            ci-diagnostics
            ${{ env.BUILD_DIR }}/**/config.log
          if-no-files-found: warn

      - name: Change ownership and permissions of build directories
        id: change-ownership-permissions
        env:
          BUILD_DIR_PATHS: >-
            "${{ env.BUILD_DIR }}"
            "${{ env.BUILD_DIR }}/.ccache"
            "${{ env.BUILD_DIR }}/.stamps"
            sources 
            target
            toolchain
          BUILD_CACHE_PATHS: >-
            "${{ env.LOCAL_BUILD_CACHE }}"
            "${{ env.LOCAL_BUILD_CACHE }}/.ccache"
            "${{ env.LOCAL_BUILD_CACHE }}/.stamps"
            "${{ env.LOCAL_BUILD_CACHE }}/sources"
            "${{ env.LOCAL_BUILD_CACHE }}/toolchain"
        run: |
          sudo mkdir --parents ${{ env.BUILD_DIR_PATHS }}
          sudo chown -R ${{ env.IMG_UID }}:${{ env.IMG_GID }} ${{ env.BUILD_DIR_PATHS }}
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} ${{ env.BUILD_DIR_PATHS }}
          if [[ "${{ env.DEBUG }}" == "true" ]]; then
            stat -c "${{ env.STAT_SYNTAX }}" ${{ env.BUILD_DIR_PATHS }}
          fi

          sudo mkdir --parents "${{ github.workspace }}"
          sudo chown -R ${{ env.IMG_UID }}:${{ env.IMG_GID }} "${{ github.workspace }}"
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} "${{ github.workspace }}"
          if [[ "${{ env.DEBUG }}" == "true" ]]; then
            stat -c "${{ env.STAT_SYNTAX }}" "${{ github.workspace }}"
          fi

          sudo mkdir --parents ${{ env.BUILD_CACHE_PATHS }}
          sudo chown -R ${{ env.IMG_UID }}:${{ env.IMG_GID }} ${{ env.BUILD_CACHE_PATHS }}
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} ${{ env.BUILD_CACHE_PATHS }}
          if [[ "${{ env.DEBUG }}" == "true" ]]; then
            stat -c "${{ env.STAT_SYNTAX }}" ${{ env.BUILD_CACHE_PATHS }}
          fi

      - name: Build ${{ env.EE_Distro }} image
        id: build-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "${{ env.DEBUG }}" == "true" ]] && echo "[pwd]: $PWD"
          [[ "${{ env.DEBUG }}" == "true" ]] && echo "[github.workspace]: ${{ github.workspace }}"
          [[ "${{ env.DEBUG }}" == "true" ]] && ls -al $PWD
          # set some build performance flags
          NB_CORES=$(grep -c '^processor' /proc/cpuinfo)
          [[ "${{ env.DEBUG }}" == "true" ]] && echo "[NB_CORES]: $NB_CORES"

          # pull the image (authentication is handled by docker/login-action@v4)
          if [[ "${{ env.DEBUG }}" == "true" ]]; then DOCKER_DEBUG="--debug"; else DOCKER_DEBUG=""; fi
          docker $DOCKER_DEBUG image pull "${{ env.EE_DistroTag }}"
          # Determine image numeric UID/GID for CAN_WRITE test; prefer image UID when available
          if [ -n "${{ env.IMG_UID }}" ]; then
            echo "Image UID:GID for CAN_WRITE test = ${{ env.IMG_UID }}:${{ env.IMG_GID }}"
          fi
          # (image UID/GID chown moved below after BUILD_DIR is set)
          # Caches are persisted by actions/cache or the runner workspace.
          # Runner workspace will be mounted directly into the container at ${{ env.IMG_ROOT_BUILD_DIR }}
          echo "Using runner workspace mount -v \\${{ github.workspace }}:${{ env.IMG_ROOT_BUILD_DIR }}"

          # Verify the non-root image user can write to the build output paths.
          CAN_WRITE=$(docker run --rm --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} --group-add ${{ env.HOST_GID }} -v "${{ github.workspace }}:${{ env.IMG_ROOT_BUILD_DIR }}" alpine sh -c "touch ${{ env.IMG_ROOT_BUILD_DIR }}/sources/.perm_test ${{ env.IMG_ROOT_BUILD_DIR }}/target/.perm_test ${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.perm_test >/dev/null 2>&1 && rm -f ${{ env.IMG_ROOT_BUILD_DIR }}/sources/.perm_test ${{ env.IMG_ROOT_BUILD_DIR }}/target/.perm_test ${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.perm_test && echo OK || echo FAIL") || CAN_WRITE=FAIL
          if [ "${CAN_WRITE}" != "OK" ]; then
            echo "::error::Build output paths are not writable by non-root UID:GID ${{ env.IMG_UID }}:${{ env.IMG_GID }}"
            exit 1
          fi
          echo "Build output paths writable by non-root UID:GID ${{ env.IMG_UID }}:${{ env.IMG_GID }}"

          USER_ARG="--user ${{ env.IMG_UID }}:${{ env.IMG_GID }}"
          GROUP_ARG="--group-add ${{ env.HOST_GID }}"

          WORKDIR_ARG="-w ${{ env.IMG_ROOT_BUILD_DIR }}"

          # CCACHE_ARG="${{ inputs.cache == 'true' && format('-e CCACHE_DIR={0}/{1}/.ccache', env.IMG_ROOT_BUILD_DIR, env.BUILD_DIR) || '' }}"
          CCACHE_ARG=()
          if [ "${{ inputs.cache }}" = "true" ]; then
            CCACHE_ARG=(-e "CCACHE_DIR=${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.ccache")
          fi

          VOLUME_ARG=(
            -v "${{ github.workspace }}:${{ env.IMG_ROOT_BUILD_DIR }}" \
            -v "${{ env.LOCAL_BUILD_CACHE }}/.ccache:${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.ccache" \
            -v "${{ env.LOCAL_BUILD_CACHE }}/.stamps:${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.stamps" \
            -v "${{ env.LOCAL_BUILD_CACHE }}/sources:${{ env.IMG_ROOT_BUILD_DIR }}/sources" \
            -v "${{ env.LOCAL_BUILD_CACHE }}/toolchain:${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/toolchain" \
          )
          # for path in "${VOLUME_ARG[@]#-v}"; do
          #   [ -n "$path" ] && stat -c "${{ env.STAT_SYNTAX }}" "${path%%:*}"
          # done

          # run the container (use debug env values when workflow input `debug` is 'true')
          if [[ "${{ env.DEBUG }}" == "true" ]]; then
            ONELOG_VAL=no
            LOGCOMBINE_VAL=never
            MTIMMEDIATE_VAL=yes
            MTDEBUG_VAL=yes
            MTVERBOSE_VAL=yes
            MTPROGRESS_VAL=no
            SHOW_STDOUT_VAL=yes
            SHOW_STDERR_VAL=yes
          else
            ONELOG_VAL=no
            LOGCOMBINE_VAL=fail
            MTIMMEDIATE_VAL=no
            MTDEBUG_VAL=no
            MTVERBOSE_VAL=no
            MTPROGRESS_VAL=no
            SHOW_STDOUT_VAL=no
            SHOW_STDERR_VAL=no
          fi

          DOCKER_ENV_FLAGS=(
            -e ONELOG=${ONELOG_VAL} \
            -e LOGCOMBINE=${LOGCOMBINE_VAL} \
            -e MTIMMEDIATE=${MTIMMEDIATE_VAL} \
            -e MTDEBUG=${MTDEBUG_VAL} \
            -e MTVERBOSE=${MTVERBOSE_VAL} \
            -e MTPROGRESS=${MTPROGRESS_VAL} \
            -e SHOW_STDOUT=${SHOW_STDOUT_VAL} \
            -e SHOW_STDERR=${SHOW_STDERR_VAL}
          )

          BASH_SCRIPT_ENV_VARS=(
            -e RECOMMENDED_J="${RECOMMENDED_J}" \
            -e NB_CORES="${NB_CORES}"
          )

          if (( 0 == 0 )) || [[ "${{ env.DEBUG }}" == "true" ]]; then
            echo "WORKDIR_ARG: ${WORKDIR_ARG}"
            echo "VOLUME_ARG: ${VOLUME_ARG[@]}"
            echo "CCACHE_ARG: ${CCACHE_ARG[@]}"
            echo "USER_ARG: $USER_ARG"
            echo "GROUP_ARG: $GROUP_ARG"
            echo "DOCKER_ENV_FLAGS: ${DOCKER_ENV_FLAGS[@]}"
            echo "BASH_SCRIPT_ENV_VARS: ${BASH_SCRIPT_ENV_VARS[@]}"
            echo "HOST_UID: $HOST_UID"
            echo "HOST_GID: $HOST_GID"
            echo "IMG_UID: $IMG_UID"
            echo "IMG_GID: $IMG_GID"
          fi

          # Source host-side container params (MEMORY_ARG etc) before invoking docker
          . "${{ github.workspace }}/container_params.sh"
          docker run \
            --rm \
            --name "build${{ env.EE_Distro }}.${{ env.OS_Codename }}.${{ github.run_id }}.${{ github.run_attempt }}" \
            ${MEMORY_ARG} \
            ${WORKDIR_ARG} \
            "${VOLUME_ARG[@]}" \
            -e VOLUME_STR="${VOLUME_ARG[*]}" \
            "${CCACHE_ARG[@]}" \
            ${USER_ARG} \
            ${GROUP_ARG} \
            "${DOCKER_ENV_FLAGS[@]}" \
            "${BASH_SCRIPT_ENV_VARS[@]}" \
            -e DISABLE_COLORS=no \
            -e MTCOLORS=auto \
            -e DISTRO=${{ env.EE_Distro }} \
            -e PROJECT=${{ env.EE_Project }} \
            -e DEVICE=${{ env.EE_Device }} \
            -e ARCH=${{ env.EE_Arch }} \
            -e BUILDER_NAME=${{ github.actor }} \
            -e BUILDER_VERSION="13.0-$(date +%Y%m%d)" \
            -e RUNNER_TYPE=${{ needs.resolve-runner.outputs.runner }} \
            "${{ env.EE_DistroTag }}" \
            bash -c 'umask 0002 && exec bash -lc '\''
              git config --global --add safe.directory "${{ env.IMG_ROOT_BUILD_DIR }}"

              # # A present stamp and missing executable confirms the inconsistent cache
              # build="${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}"
              # echo "CMake build stamp:"
              # ls -l "$build/.stamps/cmake/build_host" || true
              # echo "Installed CMake executable:"
              # ls -l "$build/toolchain/bin/cmake" || true
              # echo "CMake lookup with toolchain on PATH:"
              # PATH="$build/toolchain/bin:$PATH" command -v cmake || true
              # echo "CMake execution:"
              # "$build/toolchain/bin/cmake" --version || true

              if [[ "${{ env.DEBUG }}" == "true" ]]; then
                for path in ${VOLUME_STR//-v/}; do
                  stat -c "${{ env.STAT_SYNTAX }}" "${path#*:}"
                done
              fi

              cp --archive "${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.ccache/.cache_package_*" "${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}" || true

              . "${{ env.IMG_ROOT_BUILD_DIR }}/build_recommend.sh"
              make -j"${RECOMMENDED_J}" -l"${NB_CORES}" image

              cp --archive "${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.cache_package_*" "${{ env.IMG_ROOT_BUILD_DIR }}/${{ env.BUILD_DIR }}/.ccache" || true
            '\'''
          docker_exit_code=$?

      - name: Save build caches
        id: save-build-caches
        if: ${{ steps.restore-build-caches.conclusion == 'success' }}
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.restore-build-caches.outputs.cache-primary-key }}
          path: ${{ env.LOCAL_BUILD_CACHE }}

      # Upload diagnostics on failure and the built image when available.
      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: ${{ always() && !cancelled() && steps.build-image.outcome == 'failure' }}
        with:
          name: artifact_logs_${{ env.EE_Distro }}-${{ env.EE_Device }}.${{ env.EE_Arch }}
          # use workspace-relative path so the host runner (not the container) can find the logs
          path: |
            ${{ env.BUILD_DIR }}/.threads/logs/*.log
          overwrite: true
          include-hidden-files: true

      - name: Determine ${{ env.EE_Distro }} image path
        id: determine-image-path
        run: |
          if [ -d ${{ github.workspace }}/target ]; then
            lines=$(find ${{ github.workspace }}/target -maxdepth 1 -type f -iname "${{ env.EE_Distro }}-${{ env.EE_Device }}.${{ env.EE_Arch }}*.img.gz" 2>/dev/null | wc -l)
            if [ $lines -ne 0 ]; then
              pathfilename=$(ls -t ${{ github.workspace }}/target/${{ env.EE_Distro }}-${{ env.EE_Device }}.${{ env.EE_Arch }}*.img.gz | head --lines=1)
              [[ "${{ env.DEBUG }}" == "true" ]] && echo "[EE_image_pathfilename]: $pathfilename"
              echo "EE_image_pathfilename=$pathfilename" >> $GITHUB_OUTPUT || true
              filename="${pathfilename##*/}"
              [[ "${{ env.DEBUG }}" == "true" ]] && echo "[EE_image_filename]: $filename" || true
              echo "EE_image_filename=$filename" >> $GITHUB_OUTPUT
            else
              echo "No built image found in target directory, skipping copy."
            fi
          else
            echo "No target directory found, skipping copy of built image."
          fi

      - name: Copy built ${{ env.EE_Distro }} image to archive
        id: copy-image-to-archive
        if: ${{ steps.determine-image-path.outputs.EE_image_pathfilename != '' && !cancelled() }}
        run: |
          dest_path="${{ github.workspace }}/../target_archive"
          mkdir --parents "$dest_path"
          if cp --archive --update=older "${{ steps.determine-image-path.outputs.EE_image_pathfilename }}" "$dest_path"; then
            [[ "${{ env.DEBUG }}" == "true" ]] && echo "Copied built image to $dest_path"
          else
            echo "No newer built image to copy to $dest_path"
          fi

      - name: Upload built ${{ env.EE_Distro }} image
        if: ${{ steps.determine-image-path.outputs.EE_image_pathfilename != '' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.determine-image-path.outputs.EE_image_filename }}"
          path: "${{ steps.determine-image-path.outputs.EE_image_pathfilename }}"
          archive: false
